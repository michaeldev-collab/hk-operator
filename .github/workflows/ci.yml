name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust check + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcc
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri + BlueZ dev)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcc

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo test (cyberdeck-ble)
        run: cargo test -p cyberdeck-ble

      - name: cargo test (mcc-desktop)
        run: cargo test -p mcc-desktop

      - name: cargo clippy (workspace, warnings)
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  js:
    name: JS + harness tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install
        run: npm ci || npm install

      - name: JS unit tests
        run: npm run test:js

      - name: Verification harness
        run: npm run test:harness

  firmware-check:
    name: Firmware source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify firmware source exists
        run: |
          test -f firmware/ble-hid-hotkey-ble-config.ino
          echo "firmware source present"
        # Full Arduino/ESP-IDF compile needs board toolchain — tracked as
        # future CI improvement. This job gates that the source ships.
