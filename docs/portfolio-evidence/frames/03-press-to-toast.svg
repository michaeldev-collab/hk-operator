  <rect x="280" y="320" width="400" height="56" rx="10" fill="#1c2330" stroke="#2ea043" stroke-width="2"/>
  <text x="480" y="354" text-anchor="middle" fill="#e6edf3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">auto-pasted - Prompt - ask for help</text>

  <text x="480" y="440" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Illustrative MCC chrome - labels from public seed.js</text>
