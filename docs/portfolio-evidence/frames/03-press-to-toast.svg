<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="0" y="0" width="960" height="56" fill="#161b22"/>
  <text x="24" y="36" fill="#4493f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">HK Operator</text>
  <text x="160" y="36" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">MCC - listening for MacroEvent</text>
  <text x="680" y="36" fill="#2ea043" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">listening - MAC redacted</text>

  <text x="24" y="100" fill="#e6edf3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600">Press - BLE MacroEvent - binding - host effect</text>
  <text x="24" y="122" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Public seed path - no private prompts in this frame</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="40" y="180" width="180" height="70" rx="8" fill="#1c2330" stroke="#2ea043"/>
