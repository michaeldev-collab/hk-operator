    <text x="130" y="232" text-anchor="middle" fill="#8b949e" font-size="11">preset 2 / action 0</text>

    <text x="240" y="220" fill="#4493f8" font-size="20">&gt;</text>

    <rect x="270" y="180" width="180" height="70" rx="8" fill="#1c2330" stroke="#4493f8"/>
    <text x="360" y="212" text-anchor="middle" fill="#e6edf3" font-size="13">MacroEvent</text>
    <text x="360" y="232" text-anchor="middle" fill="#8b949e" font-size="11">GATT notify - bounded</text>

    <text x="470" y="220" fill="#4493f8" font-size="20">&gt;</text>

    <rect x="500" y="180" width="180" height="70" rx="8" fill="#1c2330" stroke="#4493f8"/>
    <text x="590" y="212" text-anchor="middle" fill="#e6edf3" font-size="13">binding 2-0</text>
    <text x="590" y="232" text-anchor="middle" fill="#8b949e" font-size="11">Prompt - help</text>

    <text x="700" y="220" fill="#4493f8" font-size="20">&gt;</text>

    <rect x="730" y="180" width="190" height="70" rx="8" fill="#1c2330" stroke="#2ea043"/>
    <text x="825" y="212" text-anchor="middle" fill="#e6edf3" font-size="13">paste / open</text>
    <text x="825" y="232" text-anchor="middle" fill="#8b949e" font-size="11">desktop effect</text>
