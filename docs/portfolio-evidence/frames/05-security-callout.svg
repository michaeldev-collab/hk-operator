<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0d1117"/>
  <rect x="0" y="0" width="960" height="56" fill="#161b22"/>
  <text x="24" y="36" fill="#4493f8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">HK Operator</text>
  <text x="160" y="36" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Security controls - Phase 4 remediations (public summary)</text>

  <text x="24" y="100" fill="#e6edf3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600">Local high-privilege surface - gated on purpose</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
    <rect x="40" y="140" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="60" y="170" fill="#2ea043">P3-01</text>
    <text x="120" y="170" fill="#e6edf3">Fire API token on loopback POST</text>
    <text x="60" y="192" fill="#8b949e">GET / health only - no WAN bind</text>

    <rect x="500" y="140" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="520" y="170" fill="#2ea043">P3-02/07</text>
    <text x="600" y="170" fill="#e6edf3">Allowlist never from profile/save</text>
    <text x="520" y="192" fill="#8b949e">Expand only via allow_command UX</text>

    <rect x="40" y="230" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="60" y="260" fill="#2ea043">P3-03</text>
    <text x="120" y="260" fill="#e6edf3">Shell id to value fingerprint</text>
    <text x="60" y="282" fill="#8b949e">Edited command text needs re-approval</text>

    <rect x="500" y="230" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="520" y="260" fill="#2ea043">P3-05/06</text>
    <text x="600" y="260" fill="#e6edf3">GitHub remotes + confined import</text>
    <text x="520" y="282" fill="#8b949e">No arbitrary FS / forge remotes</text>

    <rect x="40" y="320" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="60" y="350" fill="#2ea043">P3-08</text>
    <text x="120" y="350" fill="#e6edf3">BLE MAC redacted in UI/logs</text>
    <text x="60" y="372" fill="#8b949e">Status shows **:**:**:**:**:XX</text>

    <rect x="500" y="320" width="420" height="70" rx="8" fill="#161b22" stroke="#2ea043"/>
    <text x="520" y="350" fill="#2ea043">P3-09</text>
    <text x="600" y="350" fill="#e6edf3">URL case + MacroEvent bounds</text>
    <text x="520" y="372" fill="#8b949e">http(s) insensitive - grid indices only</text>
  </g>

  <text x="40" y="440" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Full model: docs/security-threat-model.md - no secrets in this graphic</text>
  <text x="40" y="465" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Residual: same-user token file - no OS sandbox on approved shell</text>
</svg>
